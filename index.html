<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicathon1</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <nav>
        <div class="navleft">
            <img width="150px" src="./assets/logo.png" alt="logo">
        </div>
        <div class="navright">
            <p>Home</p>
            <p>Products</p>
            <p>Contact</p>
            <div>
                <p>Place order</p>
                <img width="20px" src="./assets/placeOrder.svg" alt="placeOrder">
            </div>
        </div>
    </nav>
    <div class="buttons">
        <button class="products">Products</button>
        <button class="custom">Custom</button>
    </div>
    <main>
        <div class="dashboard">
            <div class="greatness">
            <h2>FIND YOUR<br> GREATNESS</h2>
            <p>Built for speed and confidence,
                every pair combines premium materials and bold design.
                Engineered for comfort, made for movement.
            </p>
        </div>
        <div class="heading">
            <h1>HYPE</h1>
        </div>
        <div class="color">
            <p>Choose your color</p>
            <div class="colors">
                <div class="cyan">

                </div>
                <div class="orange">

                </div>
                <div class="red">

                </div>
            </div>
            <div class="sizes">
                <div class="forty">
                    <p>40</p>
                </div>
                <div class="forty2">
                    <p>42</p>
                </div>
                <div class="forty4">
                    <p>44</p>
                </div>
            </div>
        </div>
        </div>
        <div class="shoe">
            <img src="./assets/shoe.png" alt="shoe">
        </div>
    </main>
    <footer>
        <div class="icons">
            <img width="20px" src="./assets/instagram.svg" alt="instagram">
            <img width="20px" src="./assets/facebook.svg" alt="facebook">
            <img width="20px" src="./assets/pinterest.svg" alt="pinterest">
            <img width="20px" src="./assets/youtube.svg" alt="youtube">
        
        </div>
        <div class="sneakers">
            <div class="horizontal">

            </div>
            <p>SNEAKERS FOR MORE</p>
            <div class="horizontal">
            </div>
            
        </div>
        <div class="seeproduct">
            <p>See all products</p>
            <img width="20px" src="./assets/arrow.svg" alt="arrow">
        </div>
    </footer>
</body>
</html>
